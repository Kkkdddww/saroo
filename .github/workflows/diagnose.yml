# 연결 점검용 (임시). 시크릿 값은 출력하지 않고 형식과 응답 코드만 보여준다.
name: Diagnose Supabase
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set +e
          echo "== 시크릿 형식 =="
          echo "URL 길이: ${#URL}, KEY 길이: ${#KEY}"
          [[ "$URL" =~ ^https://[a-z0-9]+\.supabase\.co$ ]] && echo "URL 형식: OK" || echo "URL 형식: 이상함 (https://xxxx.supabase.co 형태여야 함. 앞뒤 공백, 끝의 /, 대시보드 주소 등 확인)"
          [[ "$URL" == */ ]] && echo "URL 끝에 / 가 있음"
          [[ "$URL" =~ [[:space:]] || "$KEY" =~ [[:space:]] ]] && echo "공백/줄바꿈이 섞여 있음"
          case "$KEY" in sb_publishable_*) echo "KEY 종류: publishable (OK)";; eyJ*) echo "KEY 종류: JWT (anon 또는 service_role)"; echo "$KEY" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | grep -o '"role":"[a-z_]*"';; sb_secret_*) echo "KEY 종류: secret 키 (잘못됨! publishable 키를 넣어야 함)";; *) echo "KEY 종류: 알 수 없음 (앞 4글자: ${KEY:0:4})";; esac

          echo "== 익명 로그인 =="
          R=$(curl -s -m 20 -w '\n%{http_code}' -X POST "$URL/auth/v1/signup" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          CODE=$(echo "$R" | tail -1); BODY=$(echo "$R" | sed '$d')
          echo "HTTP $CODE"
          TOKEN=$(echo "$BODY" | jq -r '.access_token // empty' 2>/dev/null)
          if [ -n "$TOKEN" ]; then echo "익명 로그인: 성공"; else echo "응답: $(echo "$BODY" | head -c 300)"; fi

          if [ -n "$TOKEN" ]; then
            echo "== 서버 함수 =="
            for fn in ensure_profile my_today; do
              R=$(curl -s -m 20 -w '\n%{http_code}' -X POST "$URL/rest/v1/rpc/$fn" -H "apikey: $KEY" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d '{}')
              echo "$fn: HTTP $(echo "$R" | tail -1) $(echo "$R" | sed '$d' | head -c 200)"
            done
          fi

          echo "== 브라우저 허용(CORS) =="
          curl -s -m 20 -o /dev/null -D - -X OPTIONS "$URL/auth/v1/signup" -H "Origin: https://kkkdddww.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: apikey,content-type" | grep -i -E "^HTTP|access-control-allow-origin"

          echo "== 배포된 사이트 =="
          JS=$(curl -s -m 20 https://kkkdddww.github.io/saroo/ | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1)
          echo "JS: $JS"
          B=$(curl -s -m 20 "https://kkkdddww.github.io/saroo/$JS")
          echo "$B" | grep -q '서버가 응답하지 않아요' && echo "최신 코드(PR #3): 포함" || echo "최신 코드(PR #3): 없음"
          if [ -n "$URL" ] && echo "$B" | grep -qF "$URL"; then echo "사이트에 들어간 URL: 시크릿과 같음"; else echo "사이트에 들어간 URL: 시크릿과 다르거나 없음"; fi
